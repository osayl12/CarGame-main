<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Velocity Viper - a retro-style, neon cyberpunk browser racing game built with HTML, CSS, and vanilla JavaScript."
    />
    <link rel="icon" type="image/svg+xml" href="../gamepics/favicon.svg?v=2" />

    <title>Velocity Viper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&family=VT323&display=swap"
    />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="postion-texts">
        <h1 class="text-name">
          <svg
            class="icon icon-car"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h.5A1.5 1.5 0 0 1 21 12.5V16a1 1 0 0 1-1 1h-1a2 2 0 1 1-4 0H9a2 2 0 1 1-4 0H4a1 1 0 0 1-1-1v-3.5A1.5 1.5 0 0 1 4.5 11H5zm2.1 0h9.8l-1.1-3.5a.5.5 0 0 0-.5-.5H8.7a.5.5 0 0 0-.5.5L7.1 11zM7 15.5a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1zm10 0a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1z"
            />
          </svg>
          Velocity Viper
        </h1>
        <button id="playButton" class="play-button" onclick="startGame()">
          Start Game
        </button>
        <button class="reset-button" onclick="resetGame()">
          Reset Highest Score
        </button>
        <div id="scoreDisplay">Your Last Score is: 0</div>
        <p class="best-score">Best Score: 0</p>
        <div class="audio-container">
          <button
            id="customPlayButton"
            class="custom-play-button"
            onclick="toggleAudio()"
            aria-label="Play menu music"
          >
            <svg
              class="icon icon-play"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M8 5v14l11-7z" />
            </svg>
          </button>
          <div class="audio-controls">
            <div class="volume-control">
              <label for="volumeSlider">Volume:</label>
              <input
                type="range"
                id="volumeSlider"
                class="custom-volume-slider"
                min="0"
                max="1"
                step="0.01"
                value="1"
                oninput="setVolume()"
              />
            </div>
            <div class="music-select">
              <label for="musicSelect">Select Music:</label>
              <select
                id="musicSelect"
                class="styled-select"
                onchange="changeMusic(this.value)"
              >
                <option value="../menuaudio/m1.mp3">Song 1</option>
                <option value="../menuaudio/m2.mp3">Song 2</option>
                <option value="../menuaudio/m3.mp3">Song 3</option>
              </select>
              <div class="music-duration">Duration: 0:00 / 0:00</div>
            </div>
          </div>
          <audio id="backgroundMusic">
            <source
              id="musicSource"
              src="../menuaudio/m1.mp3"
              type="audio/mpeg"
            />
          </audio>
        </div>
      </div>
    </div>
  </body>
  <script src="../menugame/menu.js"></script>
</html>
